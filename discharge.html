<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discharge — Jyothsna Maternity Hospital</title>
    <link rel="stylesheet" href="css/style.css?v=20261013b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#A61E4D">
    <script src="js/jspdf.umd.min.js?v=20261013b"></script>
    <script src="js/jspdf.plugin.autotable.min.js?v=20261013b"></script>
</head>
<body>
<div class="app-container">
    <aside class="sidebar"><div class="sidebar-header">Jyothsna</div><nav class="sidebar-nav" id="sidebarNav"></nav></aside>
    <main class="main-wrapper">
        <header class="navbar">
            <button id="mobileMenuBtn" onclick="toggleMobileMenu()" style="display:none;background:none;border:none;color:var(--primary-navy);font-size:20px;cursor:pointer;padding:0 10px;margin-right:10px;"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-title"><h2 data-i18n="Discharge">Discharge</h2></div>
            <div class="nav-user"><span class="user-info" id="userEmail">Loading...</span><button id="logoutBtn" class="btn-logout">Logout</button></div>
        </header>
        <div class="page-content">
            <div class="card" style="margin-bottom:16px;">
                <div class="modal-body form-grid">
                    <div class="form-group full-width" style="position:relative;">
                        <label>Search patient (name, phone or ID)</label>
                        <input id="dcPatientSearch" placeholder="Type to search…" autocomplete="off" style="width:100%;">
                        <div id="dcPatientSearchResults" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid #e2e8f0;border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.08);"></div>
                        <input type="hidden" id="dcPatientId">
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;"><button class="btn-primary" type="button" id="dcLoadBtn">Load patient</button></div>
                    <div class="form-group full-width"><strong id="dcPatientLabel" style="color:var(--primary-navy);"></strong></div>
                </div>
            </div>

            <div class="form-grid" style="align-items:start;">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Discharge checklist</h3></div>
                    <div class="modal-body" id="dcChecklist"></div>
                </div>
                <div class="card">
                    <div class="card-header" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                        <h3 class="card-title">Clinical summary</h3>
                        <button class="btn-secondary" type="button" id="dcAiDraftBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> Draft from notes</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group"><label>Diagnosis / procedure</label><textarea id="dcDiagnosis" rows="2"></textarea></div>
                        <div class="form-group"><label>Hospital course</label><textarea id="dcCourse" rows="4"></textarea></div>
                        <div class="form-group"><label>Medications on discharge</label><textarea id="dcMeds" rows="3"></textarea></div>
                        <div class="form-group"><label>Advice & warning signs</label><textarea id="dcAdvice" rows="3"></textarea></div>
                        <div class="form-group"><label>Follow-up date</label><input type="date" id="dcFollowUp"></div>
                        <div class="form-group"><label>Newborn vaccine plan</label><textarea id="dcVaccines" rows="2"></textarea></div>
                        <div class="modal-footer" style="justify-content:flex-start;gap:8px;">
                            <button class="btn-primary" type="button" id="dcSaveBtn">Save checklist</button>
                            <button class="btn-secondary" type="button" id="dcPdfBtn"><i class="fa-solid fa-file-pdf"></i> Print EN</button>
                            <button class="btn-secondary" type="button" id="dcPdfTeBtn"><i class="fa-solid fa-language"></i> Print EN + TE</button>
                            <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-left:8px;">
                                <input type="checkbox" id="dcIncludeAllBills" checked> Include all admission bills
                            </label>
                            <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
                                <input type="checkbox" id="dcIncludePastHistory"> Full past history
                            </label>
                        </div>
                        <div id="dcBillsPreview" style="margin-top:12px;font-size:12px;color:#64748b;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/hospital-policy.js?v=20261013b"></script>
<script src="js/firebase-config.js?v=20261013b"></script>
<script src="js/helpers.js?v=20261013b"></script>
    <script src="js/hospital-forms.js?v=20261013b"></script>
<script src="js/branch.js?v=20261013b"></script>
<script src="js/i18n.js?v=20261013b"></script>
<script src="js/discharge.js?v=20261013b"></script>
</body>
</html>
