<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packages — Jyothsna Maternity Hospital</title>
    <link rel="stylesheet" href="css/style.css?v=20261013b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#A61E4D">
</head>
<body>
<div class="app-container">
    <aside class="sidebar"><div class="sidebar-header">Jyothsna</div><nav class="sidebar-nav" id="sidebarNav"></nav></aside>
    <main class="main-wrapper">
        <header class="navbar">
            <button id="mobileMenuBtn" onclick="toggleMobileMenu()" style="display:none;background:none;border:none;color:var(--primary-navy);font-size:20px;cursor:pointer;padding:0 10px;margin-right:10px;"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-title"><h2 data-i18n="Packages">Packages</h2></div>
            <div class="nav-user"><span class="user-info" id="userEmail">Loading...</span><button id="logoutBtn" class="btn-logout">Logout</button></div>
        </header>
        <div class="page-content">
            <div class="toolbar" style="display:flex;justify-content:space-between;margin-bottom:16px;">
                <div>
                    <h1 class="page-title">Care packages</h1>
                    <p style="color:var(--text-muted);font-size:13px;">Normal delivery, LSCS, ANC packages with inclusions. Apply from Billing using package code.</p>
                </div>
                <button class="btn-primary" type="button" id="pkAddBtn"><i class="fa-solid fa-plus"></i> Add package</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Code</th><th>Name</th><th>Price</th><th>Inclusions</th><th>Extras note</th><th>Active</th><th></th></tr></thead>
                        <tbody id="pkBody"><tr><td colspan="7" style="text-align:center;padding:20px;color:#888;">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<div id="pkModal" class="modal">
    <div class="modal-content" style="max-width:560px;">
        <div class="modal-header"><h3>Package</h3><button class="close-btn" type="button" onclick="document.getElementById('pkModal').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button></div>
        <form id="pkForm" class="modal-body">
            <input type="hidden" id="pkEditId">
            <div class="form-grid">
                <div class="form-group"><label>Code</label><input id="pkCode" required placeholder="PKG-ND"></div>
                <div class="form-group"><label>Name</label><input id="pkName" required placeholder="Normal Delivery Package"></div>
                <div class="form-group"><label>Price (₹)</label><input type="number" id="pkPrice" min="0" step="0.01" required></div>
                <div class="form-group"><label>Active</label><select id="pkActive"><option value="true">Yes</option><option value="false">No</option></select></div>
                <div class="form-group full-width"><label>Add inclusion from services</label>
                    <div style="display:flex;gap:8px;">
                        <select id="pkServiceSelect" style="flex:1;"><option value="">Select service…</option></select>
                        <button type="button" class="btn-secondary" id="pkAddServiceBtn">Add</button>
                    </div>
                </div>
                <div class="form-group full-width"><label>Inclusions (one per line)</label><textarea id="pkInclusions" rows="5" placeholder="Room charges 2 days&#10;Delivery / OT&#10;Routine meds&#10;Newborn check"></textarea></div>
                <div class="form-group full-width"><label>Not included / extras</label><textarea id="pkExtras" rows="3" placeholder="NICU, blood products, implants…"></textarea></div>
            </div>
            <div class="modal-footer"><button class="btn-primary" type="submit">Save</button></div>
        </form>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/hospital-policy.js?v=20261013b"></script>
<script src="js/firebase-config.js?v=20261013b"></script>
<script src="js/helpers.js?v=20261013b"></script>
    <script src="js/hospital-forms.js?v=20261013b"></script>
<script src="js/branch.js?v=20261013b"></script>
<script src="js/i18n.js?v=20261013b"></script>
<script src="js/packages.js?v=20261013b"></script>
</body>
</html>
