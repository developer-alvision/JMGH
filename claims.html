<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Claims — Jyothsna Maternity Hospital</title>
    <link rel="stylesheet" href="css/style.css?v=20261013b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#A61E4D">
</head>
<body>
<div class="app-container">
    <aside class="sidebar"><div class="sidebar-header">Jyothsna</div><nav class="sidebar-nav" id="sidebarNav"></nav></aside>
    <main class="main-wrapper">
        <header class="navbar">
            <button id="mobileMenuBtn" onclick="toggleMobileMenu()" style="display:none;background:none;border:none;color:var(--primary-navy);font-size:20px;cursor:pointer;padding:0 10px;margin-right:10px;"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-title"><h2 data-i18n="Insurance Claims">Insurance Claims</h2></div>
            <div class="nav-user"><span class="user-info" id="userEmail">Loading...</span><button id="logoutBtn" class="btn-logout">Logout</button></div>
        </header>
        <div class="page-content">
            <div class="toolbar" style="display:flex;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;">
                <div>
                    <h1 class="page-title">TPA / Insurance claims</h1>
                    <p style="color:var(--text-muted);font-size:13px;">Pre-auth, claim status and settlement tracking.</p>
                </div>
                <button class="btn-primary" type="button" id="clAddBtn"><i class="fa-solid fa-plus"></i> New claim</button>
            </div>
            <div class="stat-cards" style="margin-bottom:16px;">
                <div class="stat-card is-info"><div class="stat-details"><h3>Open claims</h3><div class="value" id="clOpen">0</div></div></div>
                <div class="stat-card is-warning"><div class="stat-details"><h3>Pre-auth pending</h3><div class="value" id="clPreauth">0</div></div></div>
                <div class="stat-card is-money"><div class="stat-details"><h3>Approved amount</h3><div class="value" id="clApproved">₹0</div></div></div>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Claim #</th><th>Patient</th><th>Insurer / TPA</th><th>Bill</th><th>Claimed</th><th>Approved</th><th>Status</th><th></th></tr></thead>
                        <tbody id="clBody"><tr><td colspan="8" style="text-align:center;padding:20px;color:#888;">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<div id="clModal" class="modal">
    <div class="modal-content" style="max-width:560px;">
        <div class="modal-header"><h3 id="clModalTitle">New claim</h3><button class="close-btn" type="button" onclick="document.getElementById('clModal').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button></div>
        <form id="clForm" class="modal-body">
            <input type="hidden" id="clEditId">
            <div class="form-grid">
                <div class="form-group full-width" style="position:relative;">
                    <label>Search patient (name, phone or ID)</label>
                    <input id="clPatientSearch" placeholder="Type to search…" autocomplete="off" style="width:100%;">
                    <div id="clPatientSearchResults" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid #e2e8f0;border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.08);"></div>
                </div>
                <div class="form-group"><label>Patient ID</label><input id="clPatientId" required></div>
                <div class="form-group"><label>Patient name</label><input id="clPatientName" required></div>
                <div class="form-group full-width"><label>Package / procedure (from services)</label>
                    <select id="clPackageSelect"><option value="">Select service…</option></select>
                </div>
                <div class="form-group"><label>Bill number</label><input id="clBillNo"></div>
                <div class="form-group"><label>Insurer / TPA</label><input id="clInsurer" required placeholder="e.g. Star Health / Medi Assist"></div>
                <div class="form-group"><label>Policy / member ID</label><input id="clPolicy"></div>
                <div class="form-group"><label>Pre-auth number</label><input id="clPreauthNo"></div>
                <div class="form-group"><label>Claimed amount</label><input type="number" id="clClaimed" min="0" step="0.01" required></div>
                <div class="form-group"><label>Approved amount</label><input type="number" id="clApprovedAmt" min="0" step="0.01" value="0"></div>
                <div class="form-group"><label>Status</label>
                    <select id="clStatus">
                        <option value="preauth_pending">Pre-auth pending</option>
                        <option value="preauth_approved">Pre-auth approved</option>
                        <option value="submitted">Claim submitted</option>
                        <option value="query">Query from TPA</option>
                        <option value="approved">Approved</option>
                        <option value="settled">Settled</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="form-group"><label>Package / procedure (custom)</label><input id="clPackage" placeholder="Or type custom name"></div>
                <div class="form-group full-width"><label>Notes</label><textarea id="clNotes"></textarea></div>
            </div>
            <div class="modal-footer"><button type="submit" class="btn-primary">Save claim</button></div>
        </form>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/hospital-policy.js?v=20261013b"></script>
<script src="js/firebase-config.js?v=20261013b"></script>
<script src="js/helpers.js?v=20261013b"></script>
    <script src="js/hospital-forms.js?v=20261013b"></script>
<script src="js/branch.js?v=20261013b"></script>
<script src="js/i18n.js?v=20261013b"></script>
<script src="js/claims.js?v=20261013b"></script>
</body>
</html>
