<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Alerts — Jyothsna Maternity Hospital</title>
    <link rel="stylesheet" href="css/style.css?v=20261013b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#A61E4D">
</head>
<body>
<div class="app-container">
    <aside class="sidebar"><div class="sidebar-header">Jyothsna</div><nav class="sidebar-nav" id="sidebarNav"></nav></aside>
    <main class="main-wrapper">
        <header class="navbar">
            <button id="mobileMenuBtn" onclick="toggleMobileMenu()" style="display:none;background:none;border:none;color:var(--primary-navy);font-size:20px;cursor:pointer;padding:0 10px;margin-right:10px;"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-title"><h2 data-i18n="Inventory Alerts">Inventory Alerts</h2></div>
            <div class="nav-user"><span class="user-info" id="userEmail">Loading...</span><button id="logoutBtn" class="btn-logout">Logout</button></div>
        </header>
        <div class="page-content">
            <div class="stat-cards" style="margin-bottom:16px;">
                <div class="stat-card is-due"><div class="stat-details"><h3>Out of stock</h3><div class="value" id="iaOut">0</div></div></div>
                <div class="stat-card is-warning"><div class="stat-details"><h3>Low stock</h3><div class="value" id="iaLow">0</div></div></div>
                <div class="stat-card is-info"><div class="stat-details"><h3>Expiring ≤60 days</h3><div class="value" id="iaExp">0</div></div></div>
                <div class="stat-card"><div class="stat-details"><h3>Already expired</h3><div class="value" id="iaExpired">0</div></div></div>
            </div>
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                    <h3 class="card-title" style="margin:0;">Action list</h3>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                        <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;">
                            <input type="checkbox" id="iaSelectAll"> Select all
                        </label>
                        <button class="btn-secondary" type="button" id="iaBatchDispose"><i class="fa-solid fa-trash-can"></i> Dispose selected</button>
                        <button class="btn-secondary" type="button" id="iaExport"><i class="fa-solid fa-file-csv"></i> Export</button>
                    </div>
                </div>
                <p style="font-size:12px;color:#64748b;margin:0 12px 8px;">Select expired / unsaleable physical stock and dispose individually or in batch (audit logged).</p>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th></th><th>Medicine</th><th>Batch</th><th>Stock</th><th>Reorder</th><th>Expiry</th><th>Alert</th><th>Action</th></tr></thead>
                        <tbody id="iaBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/hospital-policy.js?v=20261013b"></script>
<script src="js/firebase-config.js?v=20261013b"></script>
<script src="js/helpers.js?v=20261013b"></script>
    <script src="js/hospital-forms.js?v=20261013b"></script>
<script src="js/branch.js?v=20261013b"></script>
<script src="js/i18n.js?v=20261013b"></script>
<script src="js/inventory-alerts.js?v=20261013b"></script>
</body>
</html>
